services:
  nexo-bot:
    image: ksmaiotupnvj/nexo-bot:latest
    container_name: nexo_bot
    restart: always
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - DISCORD_BOT_TOKEN
      - PORT
      - HOST
      - DATABASE_URL
      - GITHUB_SECRET
      - GITHUB_WEBHOOK_MAX_BODY_BYTES
      - PENGURUS_CHANNEL_ID
      - ANNOUNCEMENT_CHANNEL_ID
      - WEBHOOK_DEVLOGS_CHANNEL_ID
      - WEBHOOK_RELEASE_NOTES_CHANNEL_ID
      - WELCOME_AND_RULES_CHANNEL_ID
      - LLM_BASE_URL
      - MCP_SERVER_URL
      - GOOGLE_SERVICE_ACCOUNT_FILE
      - GOOGLE_CALENDAR_ID
      - LLM_API_KEY
      - LLM_REQUEST_TIMEOUT_SECONDS
      - HF_TOKEN
      - HF_HUB_OFFLINE
      - LLM_MODEL_NAME
      - TOTAL_CONTEXT_WINDOW
      - MAX_GROUP_CONTEXT_CHARS
      - WEBHOOK_DEVLOGS_CHANNEL
      - WEBHOOK_PORT
      - GENERATOR_CHANNEL_ID
      - GENERATOR_STAGE_ID
      - CATEGORY_ID
      - MEMBER_ROLE_ID
      - PENGURUS_ROLE_ID
    volumes:
      - ./prompts:/app/prompts
      - ./data:/app/data
      - /home/admin-iot/.cache/huggingface:/root/.cache/huggingface
      - /home/admin-iot/ksm-aiot/nexo/credentials:/app/credentials:ro
      - /home/admin-iot/ksm-aiot:/home/admin-iot-hydroponik/ksm-aiot:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - ksm-aiot-network
      - llm-aiot-network

networks:
  ksm-aiot-network:
    external: true

  llm-aiot-network:
    external: true

