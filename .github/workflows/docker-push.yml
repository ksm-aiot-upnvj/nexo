name: Build & Deploy Nexo

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: "Build and Push Docker Image"
    # semantic-release creates a version-only commit after a merge. The merge
    # commit already deployed, so skip a duplicate deployment for that commit.
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(release): bump to') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nexo-bot
            context: .
            file: Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (optional for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_RELEASE }}
          
      - name: Build & Push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Nexo stack
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer webhook
        shell: bash
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_NEXO_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "$PORTAINER_WEBHOOK" ]]; then
            echo "::error::PORTAINER_NEXO_WEBHOOK_URL is not configured."
            exit 1
          fi

          http_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            --request POST "$PORTAINER_WEBHOOK")"

          if [[ "$http_status" != "200" && "$http_status" != "204" ]]; then
            echo "::error::Portainer webhook returned HTTP $http_status."
            exit 1
          fi

          echo "Portainer accepted the deployment trigger (HTTP $http_status)."

      - name: Wait for Nexo to restart and become healthy
        shell: bash
        env:
          NEXO_HEALTH_URL: ${{ secrets.NEXO_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [[ -z "$NEXO_HEALTH_URL" ]]; then
            echo "::error::NEXO_HEALTH_URL is not configured."
            exit 1
          fi

          timeout_seconds=180
          poll_interval_seconds=10
          consecutive_unhealthy=0
          saw_restart=false
          elapsed=0

          while (( elapsed < timeout_seconds )); do
            if response="$(curl --silent --show-error --fail \
              --connect-timeout 3 --max-time 5 "$NEXO_HEALTH_URL" 2>/dev/null)" \
              && jq -e '.status == "healthy" and .bot_online == true' \
                >/dev/null <<< "$response"; then
              consecutive_unhealthy=0
              if [[ "$saw_restart" == true ]]; then
                echo "Nexo restarted and reports healthy with the bot online."
                exit 0
              fi
            else
              ((consecutive_unhealthy += 1))
              if (( consecutive_unhealthy >= 2 )); then
                saw_restart=true
              fi
            fi

            sleep "$poll_interval_seconds"
            ((elapsed += poll_interval_seconds))
          done

          if [[ "$saw_restart" == true ]]; then
            echo "::error::Nexo did not become healthy within ${timeout_seconds}s after restart."
          else
            echo "::error::No restart was observed and health could not be tied to this deployment within ${timeout_seconds}s."
          fi
          exit 1
